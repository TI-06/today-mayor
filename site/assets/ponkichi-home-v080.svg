      <ellipse cx="274" cy="435" rx="22" ry="19" fill="#7a3a1a" stroke="#4b250f" stroke-width="6"/>
    </g>
    <g id="ponkichi-head">
      <g id="ponkichi-ears">
        <path d="M93 126C63 68 103 37 152 84l-13 65z" fill="url(#furMain)" stroke="#4b250f" stroke-width="9"/>
        <path d="M326 126c30-58-10-89-59-42l13 65z" fill="url(#furMain)" stroke="#4b250f" stroke-width="9"/>
        <path d="M106 116c-14-31 10-43 35-19l-12 39zM313 116c14-31-10-43-35-19l12 39z" fill="#f5b68e"/>
      </g>
      <path d="M210 70c91 0 151 61 151 143 0 87-63 145-151 145S59 300 59 213C59 131 119 70 210 70z" fill="url(#furMain)" stroke="#4b250f" stroke-width="10"/>
      <path d="M84 208c14-62 63-103 126-103s112 41 126 103c-19 64-59 102-126 102S103 272 84 208z" fill="#c87931" opacity=".5"/>
      <path d="M80 190c23-64 80-92 130-51-28 27-42 64-41 106-45 9-78-9-89-55zM340 190c-23-64-80-92-130-51 28 27 42 64 41 106 45 9 78-9 89-55z" fill="url(#mask)"/>
      <path d="M133 236c21-34 50-50 77-33 27-17 56-1 77 33-7 42-34 69-77 69s-70-27-77-69z" fill="url(#furLight)"/>
      <path d="M159 97c15-18 33-27 51-27s36 9 51 27l-16 43-35-24-35 24z" fill="#e5a54b" opacity=".95"/>
      <path d="M116 171l32-27M304 171l-32-27" stroke="#fff1c9" stroke-width="18" stroke-linecap="round"/>
      <path d="M106 193l31 9M314 193l-31 9" stroke="#3a1d11" stroke-width="10" stroke-linecap="round" opacity=".55"/>
    </g>
    <g id="ponkichi-eyes">
      <ellipse cx="151" cy="202" rx="39" ry="49" fill="#fff" stroke="#2e180f" stroke-width="7"/>
      <ellipse cx="269" cy="202" rx="39" ry="49" fill="#fff" stroke="#2e180f" stroke-width="7"/>
      <ellipse cx="158" cy="211" rx="25" ry="35" fill="url(#eye)"/>
      <ellipse cx="262" cy="211" rx="25" ry="35" fill="url(#eye)"/>
      <circle cx="149" cy="193" r="10" fill="#fff"/><circle cx="253" cy="193" r="10" fill="#fff"/>
      <circle cx="166" cy="226" r="5" fill="#d58b2f"/><circle cx="270" cy="226" r="5" fill="#d58b2f"/>
    </g>
    <g id="ponkichi-mouth">
      <path d="M193 244q17-15 34 0-3 21-17 21t-17-21z" fill="#3b2117"/>
      <ellipse cx="210" cy="244" rx="8" ry="5" fill="#f4d98e" opacity=".8"/>
      <path d="M166 270q44 49 88 0" fill="#5e2118" stroke="#3b2117" stroke-width="7" stroke-linejoin="round"/>
      <path d="M187 291q23 17 46 0" fill="#f07c75"/>
      <path d="M174 267q-14 10-30 2M246 267q14 10 30 2" fill="none" stroke="#3b2117" stroke-width="6" stroke-linecap="round"/>
      <ellipse cx="115" cy="258" rx="17" ry="10" fill="#e96f5e" opacity=".62"/><ellipse cx="305" cy="258" rx="17" ry="10" fill="#e96f5e" opacity=".62"/>
    </g>
    <g id="ponkichi-leaf" transform="translate(285 79)">
      <path d="M0 22C11-8 39-9 58 9 47 35 24 44 0 22z" fill="url(#tie)" stroke="#17633e" stroke-width="5"/>
      <path d="M8 22Q28 11 49 8" fill="none" stroke="#c5f0c9" stroke-width="4" stroke-linecap="round"/>
      <circle cx="4" cy="25" r="8" fill="#f5c95d"/>
