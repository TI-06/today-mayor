      <path d="M128 423h174" stroke="#52758a" stroke-width="5" stroke-linecap="round" opacity=".45"/>
      <circle cx="151" cy="415" r="7" fill="#f7c55a"/><circle cx="277" cy="415" r="7" fill="#f7c55a"/>
      <path d="M159 531v14M267 531v14" stroke="#49240f" stroke-width="25" stroke-linecap="round"/>
      <ellipse cx="155" cy="546" rx="35" ry="18" fill="#6e3518"/><ellipse cx="271" cy="546" rx="35" ry="18" fill="#6e3518"/>
    </g>
    <g id="ponkichi-wave-arm">
      <path d="M128 354c-44-5-75-38-75-78 0-32 19-55 44-55 22 0 38 17 38 42 0 29-16 48-42 54 17 10 33 15 50 15z" fill="url(#furMain)" stroke="#4b250f" stroke-width="8"/>
      <ellipse cx="90" cy="244" rx="34" ry="39" fill="#9d5428" stroke="#4b250f" stroke-width="7" transform="rotate(-12 90 244)"/>
      <ellipse cx="90" cy="247" rx="15" ry="18" fill="#d88d52"/>
      <ellipse cx="70" cy="229" rx="7" ry="9" fill="#e3a068"/><ellipse cx="84" cy="219" rx="7" ry="9" fill="#e3a068"/><ellipse cx="101" cy="220" rx="7" ry="9" fill="#e3a068"/><ellipse cx="113" cy="234" rx="7" ry="9" fill="#e3a068"/>
    </g>
    <g id="ponkichi-right-arm">
