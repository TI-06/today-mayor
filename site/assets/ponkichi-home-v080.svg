<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 600" role="img" aria-labelledby="title desc">
  <title id="title">タヌキ秘書ポン吉</title>
  <desc id="desc">大きな目とふわふわの毛並み、縞尻尾を持ち、手を振るアニメ調のタヌキ秘書</desc>
  <style>
    #ponkichi-float{transform-box:fill-box;transform-origin:50% 88%;animation:float 3.2s ease-in-out infinite}
    #ponkichi-wave-arm{transform-box:fill-box;transform-origin:70% 82%;animation:wave 1.8s ease-in-out infinite}
    #ponkichi-tail{transform-box:fill-box;transform-origin:20% 70%;animation:tail 2.7s ease-in-out infinite}
    #ponkichi-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.8s infinite}
    #ponkichi-ears{transform-box:fill-box;transform-origin:center bottom;animation:ear 5.4s ease-in-out infinite}
    #ponkichi-mouth{transform-box:fill-box;transform-origin:center top;animation:talk 2.2s ease-in-out infinite}
    #ponkichi-leaf{transform-box:fill-box;transform-origin:20% 80%;animation:leaf 3s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-7px) rotate(.7deg)}}
    @keyframes wave{0%,100%{transform:rotate(-7deg)}45%{transform:rotate(13deg)}70%{transform:rotate(-2deg)}}
    @keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
    @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
    @keyframes ear{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-2.5deg)}95%{transform:rotate(2deg)}}
    @keyframes talk{0%,54%,100%{transform:scaleY(1)}66%{transform:scaleY(.72)}}
    @keyframes leaf{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
    @media(prefers-reduced-motion:reduce){#ponkichi-float,#ponkichi-wave-arm,#ponkichi-tail,#ponkichi-eyes,#ponkichi-ears,#ponkichi-mouth,#ponkichi-leaf{animation:none}}
  </style>
  <defs>
    <linearGradient id="furMain" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#df9b3f"/><stop offset=".52" stop-color="#b96526"/><stop offset="1" stop-color="#743813"/></linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2bd"/><stop offset="1" stop-color="#e8b76d"/></linearGradient>
    <linearGradient id="mask" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a2b13"/><stop offset="1" stop-color="#24140e"/></linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#214f6b"/><stop offset="1" stop-color="#102f45"/></linearGradient>
    <linearGradient id="tie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66d495"/><stop offset="1" stop-color="#1c8e57"/></linearGradient>
    <radialGradient id="eye" cx="35%" cy="28%" r="75%"><stop offset="0" stop-color="#5e3a17"/><stop offset=".55" stop-color="#24130b"/><stop offset="1" stop-color="#050403"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="9" flood-color="#432713" flood-opacity=".24"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <ellipse cx="213" cy="558" rx="132" ry="19" fill="#5d442d" opacity=".18" filter="url(#soft)"/>
  <g id="ponkichi-float" filter="url(#shadow)">
    <g id="ponkichi-tail">
      <path d="M282 349c74-44 127-3 116 72-8 56-60 101-129 92 38-17 61-46 63-77 1-23-12-44-50-87z" fill="url(#furMain)" stroke="#4b250f" stroke-width="8"/>
      <path d="M345 361c24 10 40 28 48 52-2 23-13 44-31 62-8-42-25-75-50-98 10-10 21-16 33-16z" fill="#2d1b14"/>
      <path d="M284 464c25 5 48 16 68 32-21 15-47 22-76 21-12-11-22-24-29-39 12-8 24-13 37-14z" fill="#f5d99e"/>
      <path d="M326 409c14 6 26 15 36 27" fill="none" stroke="#f0ad43" stroke-width="14" stroke-linecap="round" opacity=".78"/>
    </g>
    <g id="ponkichi-body">
