      <path d="M148 335c17-39 42-58 67-58 26 0 51 19 68 58l5 126c1 35-26 59-73 59-47 0-74-24-73-59z" fill="url(#furLight)"/>
      <path d="M147 337c-18 31-27 67-28 108l36-30 24 43 34-38 34 38 24-43 37 30c-1-42-11-78-29-108z" fill="url(#suit)" opacity=".96"/>
      <path d="M188 331h52l-8 38-18 17-18-17z" fill="#fff8e8"/>
