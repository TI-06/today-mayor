<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" role="img" aria-labelledby="title desc">
  <title id="title">タヌキ秘書ポン吉</title>
  <desc id="desc">大きな目と黒い目元、大きな縞尻尾、紺色の市役所制服を着た3頭身のアニメ調タヌキ秘書</desc>
  <style>
    #ponkichi-eyes{transform-box:fill-box;transform-origin:center;animation:ponkichiBlink 4.6s infinite}
    #ponkichi-tail{transform-box:fill-box;transform-origin:20% 78%;animation:ponkichiTail 2.4s ease-in-out infinite}
    #ponkichi-ears{transform-box:fill-box;transform-origin:center bottom;animation:ponkichiEar 5.2s ease-in-out infinite}
    #ponkichi-mouth{transform-box:fill-box;transform-origin:center top;animation:ponkichiMouth 1.9s ease-in-out infinite}
    #ponkichi-binder{transform-box:fill-box;transform-origin:center bottom;animation:ponkichiBinder 3s ease-in-out infinite}
    #ponkichi-leaf-hat{transform-box:fill-box;transform-origin:center bottom;animation:ponkichiHat 3.4s ease-in-out infinite}
    @keyframes ponkichiBlink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.07)}}
    @keyframes ponkichiTail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
    @keyframes ponkichiEar{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-3deg)}94%{transform:rotate(2deg)}}
    @keyframes ponkichiMouth{0%,58%,100%{transform:scaleY(1)}68%{transform:scaleY(.78)}}
    @keyframes ponkichiBinder{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    @keyframes ponkichiHat{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(2deg)}}
    @media(prefers-reduced-motion:reduce){#ponkichi-eyes,#ponkichi-tail,#ponkichi-ears,#ponkichi-mouth,#ponkichi-binder,#ponkichi-leaf-hat{animation:none}}
  </style>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d59b63"/><stop offset="1" stop-color="#a9653d"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0d6"/><stop offset="1" stop-color="#ead0a9"/></linearGradient>
    <linearGradient id="uniform" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#295d72"/><stop offset="1" stop-color="#153b4d"/></linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#98d77f"/><stop offset="1" stop-color="#3b9366"/></linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#14352e" flood-opacity=".22"/></filter>
  </defs>
  <ellipse cx="157" cy="339" rx="101" ry="14" fill="#173e36" opacity=".14"/>
  <g id="ponkichi-tail" filter="url(#soft)">
    <path d="M222 224c71-34 99 6 78 55-17 39-68 61-116 42 33-11 56-28 66-48 8-17 0-32-28-49z" fill="url(#fur)" stroke="#4b342a" stroke-width="7"/>
    <path d="M266 235c16 5 28 16 35 32-5 13-14 24-26 33-4-24-14-44-29-58 6-5 13-7 20-7z" fill="#3a302c"/>
    <path d="M219 299c17 4 33 11 48 21-14 9-31 15-49 17-9-8-17-18-24-29 8-5 16-8 25-9z" fill="#f3e2c8"/>
  </g>
  <g id="ponkichi-body" filter="url(#soft)">
    <path d="M92 221c13-30 37-45 68-45s55 15 68 45l19 88c6 28-13 43-41 43h-92c-28 0-47-15-41-43z" fill="url(#uniform)" stroke="#173647" stroke-width="7"/>
    <path d="M126 184h68l-8 55-26 21-26-21z" fill="#fff9ed"/>
    <path d="M150 202h20l8 57-18 20-18-20z" fill="#d65e57"/>
    <path d="M100 261h120" stroke="#6d94a3" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    <circle cx="112" cy="258" r="7" fill="#f0c96b"/><circle cx="208" cy="258" r="7" fill="#f0c96b"/>
    <path d="M112 342v9M208 342v9" stroke="#47332b" stroke-width="17" stroke-linecap="round"/>
  </g>
  <g id="ponkichi-arms">
    <path d="M93 237c-25 8-36 27-27 47 8 18 29 22 47 7" fill="none" stroke="#aa673e" stroke-width="24" stroke-linecap="round"/>
    <path d="M227 237c25 8 36 27 27 47-8 18-29 22-47 7" fill="none" stroke="#aa673e" stroke-width="24" stroke-linecap="round"/>
    <circle cx="89" cy="289" r="14" fill="#f7e7cc" stroke="#4b342a" stroke-width="5"/>
    <circle cx="231" cy="289" r="14" fill="#f7e7cc" stroke="#4b342a" stroke-width="5"/>
  </g>
  <g id="ponkichi-binder" transform="translate(91 277)">
    <rect width="138" height="62" rx="11" fill="#f8fbf7" stroke="#2e6570" stroke-width="7"/>
    <rect x="52" y="-7" width="34" height="15" rx="6" fill="#e2b44e"/>
    <path d="M23 22h91M23 38h67M23 51h80" stroke="#8da9a4" stroke-width="5" stroke-linecap="round"/>
    <circle cx="111" cy="39" r="11" fill="#e6f2ed"/><path d="M106 39l4 4 7-9" fill="none" stroke="#3d956f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g id="ponkichi-head" filter="url(#soft)">
    <g id="ponkichi-ears">
      <path d="M78 75C60 37 83 19 119 48l-9 49z" fill="url(#fur)" stroke="#4b342a" stroke-width="8"/>
      <path d="M242 75c18-38-5-56-41-27l9 49z" fill="url(#fur)" stroke="#4b342a" stroke-width="8"/>
      <path d="M85 67c-8-21 5-28 22-13l-7 28zM235 67c8-21-5-28-22-13l7 28z" fill="#774c39"/>
    </g>
    <path d="M160 38c58 0 103 39 103 94 0 59-43 99-103 99S57 191 57 132c0-55 45-94 103-94z" fill="url(#fur)" stroke="#4b342a" stroke-width="8"/>
    <path d="M91 115c18-37 46-53 69-35 23-18 51-2 69 35-7 27-21 42-41 49 11 24-2 50-28 50s-39-26-28-50c-20-7-34-22-41-49z" fill="url(#face)"/>
    <path d="M84 109c14-33 47-48 76-28-19 16-29 37-30 61-24 7-42-4-46-33zM236 109c-14-33-47-48-76-28 19 16 29 37 30 61 24 7 42-4 46-33z" fill="#3c312d"/>
    <path d="M112 171c13 9 28 11 48 4 20 7 35 5 48-4-6 30-23 48-48 48s-42-18-48-48z" fill="#f5e6cc"/>
  </g>
  <g id="ponkichi-eyes">
    <ellipse cx="124" cy="126" rx="17" ry="23" fill="#fff"/>
    <ellipse cx="196" cy="126" rx="17" ry="23" fill="#fff"/>
    <ellipse cx="127" cy="130" rx="10" ry="15" fill="#273236"/>
    <ellipse cx="193" cy="130" rx="10" ry="15" fill="#273236"/>
    <circle cx="131" cy="123" r="4" fill="#fff"/><circle cx="197" cy="123" r="4" fill="#fff"/>
    <path d="M104 99q21-13 40 0M216 99q-21-13-40 0" fill="none" stroke="#4b342a" stroke-width="7" stroke-linecap="round"/>
  </g>
  <g id="ponkichi-mouth">
    <path d="M149 158q11-10 22 0-2 14-11 14t-11-14z" fill="#4a332d"/>
    <path d="M139 180q21 21 42 0" fill="none" stroke="#4a332d" stroke-width="7" stroke-linecap="round"/>
    <path d="M150 188q10 7 20 0" fill="none" stroke="#df7772" stroke-width="5" stroke-linecap="round"/>
    <circle cx="107" cy="168" r="9" fill="#e99879" opacity=".38"/><circle cx="213" cy="168" r="9" fill="#e99879" opacity=".38"/>
  </g>
  <g id="ponkichi-leaf-hat" filter="url(#soft)">
    <ellipse cx="160" cy="51" rx="54" ry="15" fill="#234e61" stroke="#173647" stroke-width="6"/>
    <path d="M160 43c-18-38 12-55 52-32-7 34-25 49-52 32z" fill="url(#leaf)" stroke="#286a4e" stroke-width="6"/>
    <path d="M162 42q20-17 42-28" fill="none" stroke="#d8efb5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="160" cy="51" r="7" fill="#e4b847"/>
  </g>
</svg>
